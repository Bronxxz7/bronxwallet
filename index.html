
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <!-- Adaptación a celulares -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Información de BRONXWALLET -->
    <title>BRONXWALLET | Tus finanzas bajo control</title>

    <meta
      name="description"
      content="BRONXWALLET: administra tus billeteras digitales, controla tus gastos, registra ingresos, realiza transferencias y alcanza tus metas de ahorro."
    />

    <!-- Colores de la aplicación -->
    <meta name="theme-color" content="#080A0E" />
    <meta name="color-scheme" content="dark" />

    <!-- Ícono del navegador -->
    <link
      rel="icon"
      type="image/png"
      href="/pwa-192x192.png"
    />

    <!-- Configuración para iPhone -->
    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="BRONXWALLET"
    />

    <link
      rel="apple-touch-icon"
      href="/pwa-192x192.png"
    />

    <!-- Configuración adicional para Android -->
    <meta
      name="mobile-web-app-capable"
      content="yes"
    />

    <!-- Apariencia inicial -->
    <style>
      :root {
        color-scheme: dark;
        background-color: #080a0e;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background-color: #080a0e;
        -webkit-text-size-adjust: 100%;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        min-height: 100dvh;
        background-color: #080a0e;
        color: #ffffff;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overscroll-behavior-y: none;
      }

      #root {
        min-height: 100vh;
        min-height: 100dvh;
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
      }

      button {
        -webkit-tap-highlight-color: transparent;
      }

      input,
      textarea,
      select {
        font-size: 16px;
      }

      ::selection {
        background: rgba(57, 116, 255, 0.35);
        color: #ffffff;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <!-- Entrada principal de React -->
    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
